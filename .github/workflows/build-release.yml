name: build-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build binary
        run: |
          swiftc ScreenCaptureStrategy.swift OCRClipboard.swift LaunchAtLogin.swift main.swift -o ocrsnip \
            -framework AppKit -framework Vision -framework Carbon \
            -framework ScreenCaptureKit -framework ApplicationServices \
            -framework ServiceManagement

      - name: Bundle app
        run: |
          mkdir -p "ocrsnip.app/Contents/MacOS"
          cp ocrsnip "ocrsnip.app/Contents/MacOS/ocrsnip"
          cp Info.plist "ocrsnip.app/Contents/Info.plist"

      - name: Build DMG
        run: |
          mkdir -p dmg_staging
          cp -R "ocrsnip.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "ocrsnip" \
            -srcfolder dmg_staging -ov -format UDZO ocrsnip.dmg

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ocrsnip.dmg
